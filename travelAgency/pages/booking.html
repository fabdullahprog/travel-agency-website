<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Travel | Booking</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <!--  Header / Navigation -->
  <header id="header" role="banner">
    <div class="container">
      <a href="../index.html" class="logo" aria-label="Explore Travel Home">Explore Travel</a>
      <nav role="navigation" aria-label="Main navigation">
        <ul class="nav">
          <li><a href="../index.html">Home</a></li>
          <li><a href="destinations.html">Destinations</a></li>
          <li><a href="packages.html">Packages</a></li>
          <li><a href="booking.html" class="active">Booking</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Booking Section -->
  <main>
  <section id="booking" style="padding:3rem 1rem;">
  <div class="container" style="max-width:600px; margin:auto;">
  <h1>Booking Form</h1>
  <p>Fill the form and we’ll contact you soon to confirm your booking.</p>
  <form id="booking-form" action="#" method="post" autocomplete="on" style="display:flex; flex-direction:column; gap:1rem; margin-top:2rem;">

  <label for="name">Full Name</label>
  <input id="name" name="name" type="text" required placeholder="Your full name" />

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required placeholder="you@example.com" />

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" required placeholder="+8801XXXXXXXXX" />
<!-- Gender -->
<label>Gender</label>
<div class="inline">
  <label><input type="radio" name="gender" value="Male" required> Male</label>
  <label><input type="radio" name="gender" value="Female"> Female</label>
  <label><input type="radio" name="gender" value="Other"> Other</label>
</div>

<label for="travel_doc">Upload Travel Document</label>
<input id="travel_doc" name="travel_doc" type="file" accept=".jpg,.jpeg,.png,.pdf" required>


<!-- Evidence Description  -->
<label for="description">Evidence Description</label>
<textarea id="description" name="description" rows="4" placeholder="Describe your evidence..." required></textarea>

<!-- Submission Time  -->
<label for="submission_time">Submission Time</label>
<input id="submission_time" name="submission_time" type="time" required>
  <!-- Destination -->
  <label for="destination">Destination</label>
  <select id="destination" name="destination" required>
    <option value="">-- Select Destination --</option>
    <option value="coxsbazar">Cox's Bazar (3D/2N)</option>
    <option value="sundarbans">Sundarbans (2D/1N)</option>
    <option value="saintmartin">Saint Martin (2D/1N)</option>
  </select>

  <label for="date">Travel Date</label>
  <input id="date" name="date" type="date" required />

  <!-- Progress -->
  <label>Booking Progress</label>
  <div style="display:flex; align-items:center; gap:10px;">
    <progress value="60" max="100"></progress>
    <span>60%</span>
  </div>

  <!-- Rating -->
  <label for="rating">Rate Our Company (0–10)</label>
  <input id="rating" name="rating" type="range" min="0" max="10" value="5" />

  <!-- Checkbox -->
  <label style="display:flex; align-items:center; gap:10px; margin-top:0.5rem;">
    <input type="checkbox" required />
    <span>I confirm that the above information is correct.</span>
  </label>

  <button type="submit" class="btn primary">Submit Booking</button>
</form>

      </div>
    </section>
  </main>

   <!-- Footer -->
  <footer role="contentinfo" style="padding:1rem; text-align:center;">
    <div class="container">
       <p>© 2025 Explore Travel — All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
